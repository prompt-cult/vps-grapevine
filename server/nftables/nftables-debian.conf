#!/usr/sbin/nft -f
# vps-grapevine firewall for Debian Trixie (Podman, no Docker daemon)
#
# Design: kernel NAT DNATs 80/443 to 127.0.0.1:8080/8443 so rootless
# Traefik (running as the apps user) can serve HTTPS without binding
# privileged ports or running as root.
#
# Requires:
#   net.ipv4.ip_forward = 1
#   net.ipv4.conf.all.route_localnet = 1
#   net.ipv4.conf.ens6.route_localnet = 1
# (persisted in /etc/sysctl.d/99-route-localnet.conf)
#
# This file flushes and replaces the entire ruleset.
# See server/nftables/README.md before applying.

flush ruleset

table inet vps_grapevine_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept comment "loopback"

        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept comment "ping + pmtu"
        ip6 nexthdr ipv6-icmp accept comment "ndp/pmtu"

        tcp dport 22 accept comment "ssh (vibe bridge + admin)"
        tcp dport 80 accept comment "http (dnat to 127.0.0.1:8080)"
        tcp dport 443 accept comment "https (dnat to 127.0.0.1:8443)"
        # DNAT targets — packets rewritten to 127.0.0.1:8080/8443 arrive
        # on the input chain (local delivery), so these must be allowed.
        tcp dport 8080 accept comment "traefik http (dnat target)"
        tcp dport 8443 accept comment "traefik https (dnat target)"

        counter log prefix "nft-drop-input " limit rate 5/second burst 5 packets
    }

    chain forward {
        type filter hook forward priority filter; policy accept;

        ct state invalid drop
        ct state established,related accept
    }
}

table ip vps_grapevine_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # DNAT incoming 80/443 to loopback high ports where
        # rootless Traefik listens (as the apps user).
        # Traefik entryPoints: http on 8080, https on 8443.
        iifname != "lo" tcp dport 80 dnat to 127.0.0.1:8080 comment "http -> traefik rootless"
        iifname != "lo" tcp dport 443 dnat to 127.0.0.1:8443 comment "https -> traefik rootless"
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Masquerade so reply traffic from 127.0.0.1 has the right source IP.
        oifname "lo" masquerade
    }
}
