#!/usr/sbin/nft -f
# vps-grapevine firewall for Debian Trixie (Podman, no Docker daemon)
#
# Design: kernel NAT redirects 80/443 to high loopback ports so rootless
# Traefik (running as the apps user) can serve HTTPS without binding
# privileged ports or running as root.
#
# This file defines its OWN table; it never flushes the ruleset.
# See server/nftables/README.md before applying.

table inet vps_grapevine_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept comment "loopback"

        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept comment "ping + pmtu"
        ip6 nexthdr ipv6-icmp accept comment "ndp/pmtu"

        tcp dport 22 accept comment "ssh (vibe bridge + admin)"
        tcp dport 80 accept comment "http (redirected to 8080 by nat)"
        tcp dport 443 accept comment "https (redirected to 8443 by nat)"

        counter log prefix "nft-drop-input " limit rate 5/second
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        # Podman rootless containers use slirp4netns/pasta (userspace),
        # not kernel forwarding — so no docker* interface rules needed.
        # If rootful Podman is used later, add:
        #   iifname "podman*" accept
        #   ct status dnat accept

        counter log prefix "nft-drop-forward " limit rate 5/second
    }
}

table ip vps_grapevine_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Redirect incoming 80/443 to high loopback ports where
        # rootless Traefik listens (as the apps user).
        # Traefik entryPoints: http on 8080, https on 8443.
        tcp dport 80 redirect to :8080 comment "http → traefik rootless"
        tcp dport 443 redirect to :8443 comment "https → traefik rootless"
    }
}
