#!/usr/sbin/nft -f
# vps-grapevine firewall: input = loopback, icmp, established, tcp 22/80/443.
#
# Coexistence with Docker: this file defines its OWN table; it never flushes
# the ruleset. Docker (iptables/nft backend) installs its own base chains in
# the DOCKER tables; two base chains at the same hook are both evaluated.
# Published container ports arrive at the FORWARD chain already DNAT'd, so
# they pass via `ct status dnat accept` below — no open-forward hole.
# See server/nftables/README.md before applying.

table inet vps_grapevine_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept comment "loopback"

        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept comment "ping + pmtu"
        ip6 nexthdr ipv6-icmp accept comment "ndp/pmtu"

        tcp dport 22 accept comment "ssh"
        tcp dport 80 accept comment "http (le acme + redirect)"
        tcp dport 443 accept comment "https"

        # Everything else: dropped by policy. Count it so fail2ban-style
        # debugging stays possible:
        counter log prefix "nft-drop-input " limit rate 5/second
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        # Traffic DNAT'd by Docker (published ports) — e.g. traefik on
        # 80/443 is DNAT'd to the container IP and traverses FORWARD:
        ct status dnat accept

        # Container egress + container-to-container on the default bridge
        # and custom compose bridges (docker0, br-xxxx):
        iifname "docker*" accept

        counter log prefix "nft-drop-forward " limit rate 5/second
    }
}
