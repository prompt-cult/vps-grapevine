name: vibed-release

on:
  push:
    tags: ["vibed-release/[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string, e.g. 0.1.0. Dispatch builds are marked pre-release."
        required: false
        type: string

permissions:
  contents: write

env:
  BINS: "vibed vibed-cli"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "$TAG" =~ ^vibed-release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unexpected tag format: $TAG" >&2
              exit 1
            fi
            VERSION="${TAG#vibed-release/}"
            PRERELEASE=false
          else
            DATE="$(date -u +%Y%m%d)"
            VERSION="nightly-${DATE}"
            TAG="vibed-${VERSION}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build_linux_x64:
    name: Build Linux x64 (Debian Trixie)
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: Build in Debian Trixie container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cd vibed
              cargo build --release --locked
              mkdir -p /work/dist
              cp target/release/vibed target/release/vibed-cli /work/dist/
            '

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          out="vibed_${{ needs.meta.outputs.version }}_${target}.tar.gz"
          tar -C dist -czf "$out" vibed vibed-cli
          sha256sum "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: vibed_*.tar.gz
          if-no-files-found: error

  build_linux_arm64:
    name: Build Linux ARM64 (Debian Trixie)
    runs-on: ubuntu-24.04-arm
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build in Debian Trixie container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cd vibed
              cargo build --release --locked
              mkdir -p /work/dist
              cp target/release/vibed target/release/vibed-cli /work/dist/
            '

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          target="aarch64-unknown-linux-gnu"
          out="vibed_${{ needs.meta.outputs.version }}_${target}.tar.gz"
          tar -C dist -czf "$out" vibed vibed-cli
          sha256sum "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: vibed_*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - meta
      - build_linux_x64
      - build_linux_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="release_notes.md"

          if [[ "$PRERELEASE" == "true" ]]; then
            echo "## vibed nightly $VERSION" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Automated build from the default branch." >> "$NOTES_FILE"
          else
            echo "## vibed $VERSION" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "### Changes" >> "$NOTES_FILE"
            echo '```' >> "$NOTES_FILE"
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$LAST_TAG" ]]; then
              git log "${LAST_TAG}..HEAD" --oneline --no-decorate >> "$NOTES_FILE" || echo "No changes" >> "$NOTES_FILE"
            else
              git log --oneline --no-decorate -20 >> "$NOTES_FILE" || echo "Initial release" >> "$NOTES_FILE"
            fi
            echo '```' >> "$NOTES_FILE"
          fi

          echo "" >> "$NOTES_FILE"
          echo "### Assets" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "- \`vibed_${VERSION}_x86_64-unknown-linux-gnu.tar.gz\` — Linux x64 (Debian Trixie, glibc): \`vibed\` + \`vibed-cli\`" >> "$NOTES_FILE"
          echo "- \`vibed_${VERSION}_aarch64-unknown-linux-gnu.tar.gz\` — Linux ARM64 (Debian Trixie, glibc): \`vibed\` + \`vibed-cli\`" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "### Install" >> "$NOTES_FILE"
          echo '```bash' >> "$NOTES_FILE"
          echo "curl -L \"https://github.com/${REPO}/releases/download/${TAG}/vibed_${VERSION}_x86_64-unknown-linux-gnu.tar.gz\" | tar -xz" >> "$NOTES_FILE"
          echo "install -m755 vibed vibed-cli /usr/local/bin/" >> "$NOTES_FILE"
          echo '```' >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "# Linux ARM64" >> "$NOTES_FILE"
          echo '```bash' >> "$NOTES_FILE"
          echo "curl -L \"https://github.com/${REPO}/releases/download/${TAG}/vibed_${VERSION}_aarch64-unknown-linux-gnu.tar.gz\" | tar -xz" >> "$NOTES_FILE"
          echo '```' >> "$NOTES_FILE"

          FLAGS=""
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS="--prerelease"
          fi

          gh release create "$TAG" \
            $FLAGS \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            dist/*.tar.gz
