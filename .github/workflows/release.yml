name: release
on:
  push:
    tags: ["20*-*"]
permissions:
  contents: write
env:
  VERSION: ${{ github.ref_name }}
jobs:
  build_linux_x64:
    name: Linux x64 binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian Trixie container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cd vibed
              cargo build --release --locked
              mkdir -p /work/dist
              cp target/release/vibed target/release/vibed-cli /work/dist/
            '
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="vibed_${VERSION}_x86_64-unknown-linux-gnu.tar.gz"
          tar -C dist -czf "$out" vibed vibed-cli
          sha256sum "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: vibed_*.tar.gz
          if-no-files-found: error

  build_linux_arm64:
    name: Linux ARM64 binaries
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build in Debian Trixie container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:trixie-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cd vibed
              cargo build --release --locked
              mkdir -p /work/dist
              cp target/release/vibed target/release/vibed-cli /work/dist/
            '
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="vibed_${VERSION}_aarch64-unknown-linux-gnu.tar.gz"
          tar -C dist -czf "$out" vibed vibed-cli
          sha256sum "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: vibed_*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release (skill + binaries)
    runs-on: ubuntu-latest
    needs: [build_linux_x64, build_linux_arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Stamp skill with version footer
        run: |
          mkdir -p dist
          cp SKILL.md dist/SKILL.md
          printf '\n---\nversion: %s\n' "${GITHUB_REF_NAME}" >> dist/SKILL.md
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          find dist-artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## vps-grapevine ${GITHUB_REF_NAME}"
            echo ""
            echo "- \`SKILL.md\` — skill kit, version stamped at the bottom."
            echo "- \`vibed_${GITHUB_REF_NAME}_x86_64-unknown-linux-gnu.tar.gz\` — Linux x64 (Debian Trixie, glibc): \`vibed\` + \`vibed-cli\`"
            echo "- \`vibed_${GITHUB_REF_NAME}_aarch64-unknown-linux-gnu.tar.gz\` — Linux ARM64 (Debian Trixie, glibc): \`vibed\` + \`vibed-cli\`"
            echo ""
            echo "### Install binaries"
            echo '```bash'
            echo "curl -L \"https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/vibed_${GITHUB_REF_NAME}_x86_64-unknown-linux-gnu.tar.gz\" | tar -xz"
            echo "install -m755 vibed vibed-cli /usr/local/bin/"
            echo '```'
          } > release_notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "vps-grapevine ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
