# Traefik static configuration for rootless Podman on Debian Trixie
# Listens on 127.0.0.1:8080 (http) and 127.0.0.1:8443 (https)
# nftables redirects incoming 80→8080 and 443→8443 at the kernel level

entryPoints:
  http:
    address: "127.0.0.1:8080"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: "127.0.0.1:8443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: "massey1905+stenographer@gmail.com"
      storage: "/data/acme.json"
      httpChallenge:
        entryPoint: http

api:
  dashboard: true
  insecure: false

log:
  level: INFO
  filePath: "/data/traefik.log"

accessLog:
  filePath: "/data/access.log"
