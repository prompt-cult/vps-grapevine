# Traefik static configuration for rootless Podman on Debian Trixie
# Listens on :8080 (http) and :8443 (https) inside the container.
# The Quadlet PublishPort=127.0.0.1:8080:8080 binds these to loopback only.
# nftables DNATs incoming 80→127.0.0.1:8080 and 443→127.0.0.1:8443 at the kernel level.

entryPoints:
  http:
    address: ":8080"
  https:
    address: ":8443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: "ops@example.com"
      storage: "/data/acme.json"
      httpChallenge:
        entryPoint: http

api:
  dashboard: false
  insecure: false

log:
  level: INFO
  filePath: "/data/traefik.log"

accessLog:
  filePath: "/data/access.log"
