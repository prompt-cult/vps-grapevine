# OpenResty sidecar nginx.conf
# Email-based rate limiting proxy for Zitadel/Forgejo
# Sits between Traefik and the app inside docker-compose network
#
# The upstream is set via APP_UPSTREAM env var at container start.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Lua shared dict for rate limiting (2MB = ~10k entries)
    lua_shared_dict email_rate_limit 2m;

    # Resolver for Docker DNS
    resolver 127.0.0.11 valid=10s;

    # Default Lua package paths
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    # Read upstream from environment
    env APP_UPSTREAM;

    init_by_lua_block {
        local upstream = os.getenv("APP_UPSTREAM")
        if not upstream then
            upstream = "app:8080"
        end
        _G.app_upstream = upstream
        ngx.log(ngx.NOTICE, "OpenResty sidecar proxying to: " .. upstream)
    }

    server {
        listen 8080;

        access_log /dev/stdout;
        error_log /dev/stderr warn;

        # Connection limiting (prevents slowloris)
        limit_conn_zone $binary_remote_addr zone=addr:1m;

        # Main proxy with email rate limiting
        location / {
            limit_conn addr 20;

            access_by_lua_block {
                local rate_limit = require "rate-limit"
                rate_limit.enforce()
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            set $upstream $app_upstream;
            proxy_pass http://$upstream;
        }

        # Health checks (no rate limiting)
        location /healthz {
            set $upstream $app_upstream;
            proxy_pass http://$upstream;
        }

        # Static assets (no rate limiting)
        location /ui/assets/ {
            set $upstream $app_upstream;
            proxy_pass http://$upstream;
        }

        # gRPC endpoints (no rate limiting, pass through)
        location ~ ^/zitadel\.(auth|management|admin|system)\.v1\. {
            set $upstream $app_upstream;
            grpc_pass grpc://$upstream;
        }
    }
}
